    <button onclick="
  console.log(`Cart quantity: ${cartQuantity}`);
">Show Quantity</button>

<button onclick="
    cartQuantity+=(isCartFull(cartQuantity,4)?4:0)
  console.log(`Cart quantity: ${cartQuantity}`);
">+4</button>

<button onclick="
  cartQuantity+=(isCartFull(cartQuantity,5)?5:0)

<script>

    const name="Vinay"
    console.log(`My name is ${name}`)
    const coffee=5;

    const cost=coffee+bagels+soup;
    console.log(`Cost of food: $${cost}`);
    const tax=0.1*cost;
    console.log(`Tax(10%):$${tax}`);
    const totalCost=tax+cost;
    console.log(`Total cost:$${totalCost}`);
    
    let cartQuantity=0;
    function isCartFull(cartQuantity,val){
        if(val>0){
            if(cartQuantity+val>=10){
                alert('The cart is full');
                return false;
            }else{
                return true;
            }
        }
        else{
            if(cartQuantity+val<=0){
                alert('Not enough items in the cart');
                return false;
            }else{
                return true;
            }
        }
        
    }
    
</script>
